[project]
name = "defectfusion"
version = "0.1.0"
description = "Training-free few-shot anomaly detection with optional defect typing"
requires-python = ">=3.10"
dependencies = ["numpy", "Pillow", "torch", "torchvision", "transformers", "scikit-learn"]

[project.optional-dependencies]
crf = ["pydensecrf"]

[project.scripts]
defectfusion = "defectfusion.cli:main"
